services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ":5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PortfolioWorks: Host=postgres;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD}
      Storage__RootPath: /app/data/uploads
      Umu__Address: ${UMU_ADDRESS}
      Umu__Authorization: ${UMU_AUTHORIZATION}
    extra_hosts:
      - host.docker.internal:host-gateway # 
    ports:
      - "8080:8080"
    volumes:
      - uploaded-works:/app/data/uploads

volumes:
  postgres-data:
  uploaded-works:

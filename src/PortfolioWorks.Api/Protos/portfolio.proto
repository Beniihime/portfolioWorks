syntax = "proto3";
option csharp_namespace = "PortfolioWorks.Api";
package portfolio;

import "google/protobuf/timestamp.proto";

service PortfolioService {
  rpc GetDisciplines (GetDisciplinesRequest) returns (GetDisciplinesResponse);
  // Файл передаётся чанками: метаданные (student_email или student_id,
  // discipline_id, file_name, content_type) задаются в первом сообщении,
  // в следующих достаточно content. Если метаданные переданы повторно —
  // они должны совпадать.
  rpc UploadWork (stream UploadWorkRequest) returns (UploadWorkResponse);
  rpc ListWorks (ListWorksRequest) returns (ListWorksResponse);
  // Серверный стриминг: в первом сообщении приходят file_name, content_type,
  // size_bytes (и, возможно, первая часть content), в следующих — только content.
  rpc DownloadWork (DownloadWorkRequest) returns (stream DownloadWorkResponse);
}

message GetDisciplinesRequest {
  // Достаточно одного из полей: student_email или student_id.
  string student_email = 1;
  optional int32 student_id = 2;
}
message Discipline {
  int32 id = 1;
  string name = 2;
  repeated int32 semesters = 3;
  // Тип объекта из УМУ: 2 — дисциплина, 3 — практика, 6 — ГИА и т.д.
  int32 object_type_id = 4;
  string object_type_name = 5;
  // Вид практики: 6 — учебная, 7 — производственная, 8 — НИР, 72 — преддипломная; 0 — не практика.
  int32 practice_type_id = 6;
  string practice_type_name = 7;
  bool has_course_work = 8;
  bool has_course_project = 9;
  // Загруженные работы студента по этой дисциплине.
  repeated WorkFile files = 10;
  // Последняя оценка по дисциплине; отсутствует, если оценки нет.
  DisciplineGrade grade = 11;
}
message DisciplineGrade {
  int32 value = 1;        // Код шкалы оценок
  string text = 2;        // Оценка ("Отлично")
  string short_text = 3;  // Сокращение ("Отл")
}
message WorkFile {
  string id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  google.protobuf.Timestamp uploaded_at = 5;
}
message StudyGroup {
  // Код записи студента, по которой построен учебный план. Его же можно
  // передавать в UploadWork/ListWorks как student_id.
  int32 student_id = 1;
  int32 group_id = 2;
  string group_name = 3;
  string specialty_name = 4;
  string level_name = 5;
  repeated Discipline disciplines = 6;
}
// Учебные планы студента по учебным группам. Внутри группы — только позиции,
// к которым можно приложить работу: практики и дисциплины с курсовой работой
// или курсовым проектом. Группы без таких позиций не возвращаются.
message GetDisciplinesResponse { repeated StudyGroup groups = 1; }
message UploadWorkRequest {
  string student_email = 1;
  int32 discipline_id = 2;
  string file_name = 3;
  string content_type = 4;
  bytes content = 5;
  // Альтернатива student_email; задаётся в первом сообщении.
  optional int32 student_id = 6;
}
message UploadWorkResponse { string id = 1; string error = 2; }
// Достаточно одного из полей: student_email или student_id.
message ListWorksRequest {
  string student_email = 1;
  optional int32 student_id = 2;
}
message UploadedWork { string id = 1; Discipline discipline = 2; string file_name = 3; string content_type = 4; int64 size_bytes = 5; google.protobuf.Timestamp uploaded_at = 6; }
message ListWorksResponse { repeated UploadedWork works = 1; }
message DownloadWorkRequest {
  string work_id = 1;
  // Достаточно одного из полей: student_email или student_id.
  string student_email = 2;
  optional int32 student_id = 3;
}
message DownloadWorkResponse {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  bytes content = 4;
}
